 const indoorNote={zh:'路线可能经过楼上连廊；连廊与下方地面通路分层，具体楼层与出入口待确认。',en:'Connected teaching wings may use indoor links; floors and entrances need confirmation.',ja:'連結教学棟の経路は館内通路を含む場合があります。',ru:'Маршрут между соединёнными корпусами может включать внутренние переходы.',fr:'Les ailes reliées peuvent emprunter des passages intérieurs.',ko:'연결 강의동 경로에는 실내 통로가 포함될 수 있습니다.'};
 const indoorTrip=routePts.some(pt=>indoorChains.some(c=>c.some(v=>K(v)===K(pt))));
 const hospitalTrip=(startId==='hospital'&&endId!=='southGate')||(endId==='hospital'&&startId!=='southGate');
 setText('routeInfo',`${t.success}: ${placeName(a,lang)} → ${placeName(b,lang)} · ${t.steps}: ${routePts.length}. ${hospitalTrip?t.viaSouth+' ':''}${t.routeInfo}${indoorTrip?' '+indoorNote[lang]:''}`);
 drawMap();if(focus)fitPath(routePts);
}
function fitPath(pts){if(!pts?.length)return;let xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);let xmin=Math.min(...xs)-95,xmax=Math.max(...xs)+95,ymin=Math.min(...ys)-115,ymax=Math.max(...ys)+115;setViewFit(xmin,ymin,xmax,ymax);}
function setViewFit(xmin,ymin,xmax,ymax){const box=document.getElementById('viewport').getBoundingClientRect(),aspect=box.width/box.height;let w=xmax-xmin,h=ymax-ymin;if(w/h<aspect){let diff=h*aspect-w;xmin-=diff/2;xmax+=diff/2;}else{let diff=w/aspect-h;ymin-=diff/2;ymax+=diff/2;}view={x:xmin,y:ymin,w:xmax-xmin,h:ymax-ymin};vbox();}
function zoom(factor,cx=view.x+view.w/2,cy=view.y+view.h/2){const nw=Math.max(120,Math.min(1450,view.w*factor)),nh=view.h*nw/view.w;let rx=(cx-view.x)/view.w,ry=(cy-view.y)/view.h;view={x:cx-nw*rx,y:cy-nh*ry,w:nw,h:nh};vbox();}
const viewport=document.getElementById('viewport');
function pointerMap(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const mat=svg.getScreenCTM();if(!mat)return[view.x+view.w/2,view.y+view.h/2];const p=pt.matrixTransform(mat.inverse());return[p.x,p.y];}
viewport.addEventListener('wheel',e=>{e.preventDefault();const p=pointerMap(e);zoom(e.deltaY>0?1.16:1/1.16,p[0],p[1]);},{passive:false});
// Pointer capture must NOT happen on pointerdown: doing so steals clicks from SVG buildings.
// Only begin panning and capture the pointer after a real movement (>6 screen pixels).
const DRAG_THRESHOLD=6;
viewport.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'&&e.button!==0)return;
 drag={id:e.pointerId,x:e.clientX,y:e.clientY,start:{...view},moved:false};
});
viewport.addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.id)return;
 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(!drag.moved && Math.hypot(dx,dy)<DRAG_THRESHOLD)return;
 if(!drag.moved){drag.moved=true;viewport.setPointerCapture(e.pointerId);}
 const rect=svg.getBoundingClientRect(),sx=drag.start.w/rect.width,sy=drag.start.h/rect.height;
 view.x=drag.start.x-dx*sx;view.y=drag.start.y-dy*sy;vbox();
});
viewport.addEventListener('pointerup',e=>{if(drag?.id===e.pointerId)drag=null;});
viewport.addEventListener('pointercancel',e=>{if(drag?.id===e.pointerId)drag=null;});
document.getElementById('plus').onclick=()=>zoom(.78);document.getElementById('minus').onclick=()=>zoom(1.28);document.getElementById('reset').onclick=()=>{view={x:0,y:0,w:1056,h:1408};vbox();};
document.getElementById('routeBtn').onclick=()=>navigate(true);start.onchange=()=>navigate(false);end.onchange=()=>navigate(false);
langSelect.onchange=()=>{lang=langSelect.value;updateLabels();navigate(false);};
document.getElementById('setStart').onclick=()=>{start.value=selected;navigate(true);};document.getElementById('setEnd').onclick=()=>{end.value=selected;navigate(true);};
// Coze links: ?from=library&to=hospital&lang=en
const query=new URLSearchParams(location.search);let qlang=query.get('lang');if(UI[qlang])lang=qlang;langSelect.value=lang;
updateSelects();const alias=id=>/^J[A-I]$/.test(id||'')?id.slice(1):id;const urlFrom=alias(query.get('from')),urlTo=alias(query.get('to'));
if(pmap.has(urlFrom))start.value=urlFrom;else start.value='library';
if(pmap.has(urlTo))end.value=urlTo;else end.value='hospital';
updateLabels();navigate(false);
// Structural self-checks, accessible from the browser console.
function audit(){let failures=[];for(const a of PLACES)for(const b of PLACES){if(a!==b&&!shortest(a.entrance,b.entrance).length)failures.push(a.id+' -> '+b.id);}return{places:PLACES.length,roadSegments:segments.length,vertices:NET.size,tests:PLACES.length*(PLACES.length-1),unreachable:failures.length,examples:failures.slice(0,10)};}
window.campusAudit=audit;window.campusPlaces=PLACES;window.campusShortest=(a,b)=>shortest(pmap.get(a).entrance,pmap.get(b).entrance);
const report=audit();if(report.unreachable){setText('error',`${report.unreachable} routes are disconnected; see campusAudit() in console.`);console.error(report);}else console.info('Campus routing connectivity OK:',report);
</script>
